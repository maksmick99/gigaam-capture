name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install Windows extras
        if: runner.os == 'Windows'
        run: python -m pip install -e ".[windows]"

      - name: Lint
        run: python -m ruff check src tests

      - name: Test
        run: python -m pytest -q --cov=gigaam_capture --cov-report=term-missing

      - name: Report capabilities
        run: python -m gigaam_capture.inspect --no-active-target